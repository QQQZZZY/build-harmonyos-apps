<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>serve-hos · HarmonyOS</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main class="workbench">
  <aside class="devices panel"><header><strong>serve-hos</strong><button id="refresh-devices" aria-label="刷新设备">↻</button></header>
    <label class="sr-only" for="device-search">搜索设备</label><input id="device-search" type="search" placeholder="搜索设备或模拟器">
    <h2>已连接设备</h2><div id="devices"></div><h2>本地模拟器</h2><div id="emulators"></div><p id="device-message" class="note"></p>
    <footer class="note">仅在本机运行。关闭页面不会停止服务。</footer>
  </aside>
  <section class="preview" aria-label="设备预览">
    <header class="preview-header"><strong id="device-name">HarmonyOS</strong><span id="connection" role="status">正在连接…</span></header>
    <div id="viewport"><canvas id="screen" tabindex="0" aria-label="设备触摸屏"></canvas><p id="empty">等待设备画面</p></div>
    <p id="hint" class="note">等待连接</p>
    <nav class="toolbar" aria-label="设备控制"><button id="home" data-device>Home</button><button id="back" data-device>Back</button><button id="download" data-device>截图</button><button id="calibrate">校准</button><button id="fit">适应</button><label class="sr-only" for="zoom">缩放</label><select id="zoom"><option value="fit">适应窗口</option><option value="0.5">50%</option><option value="1">100%</option><option value="1.5">150%</option></select></nav>
    <div class="toolbar"><label for="gesture">手势</label><select id="gesture"><option value="swipe">轻触 / 滑动</option><option value="doubletap">双击</option><option value="longpress">长按</option><option value="drag">拖拽</option></select><label for="source">来源</label><select id="source"><option value="auto">自动</option><option value="sck">SCK</option><option value="hdc">HDC</option></select><button id="retry">重试采集</button></div>
    <p id="message" role="status" aria-live="polite"></p>
  </section>
  <aside class="tools panel"><header><strong>工具</strong><span id="session-label"></span></header><dl id="metadata"></dl><p id="warning" role="status"></p>
    <details id="application-panel" open><summary>应用</summary><p class="note">最近安装 / 启动</p><dl id="application"><dt>应用</dt><dd>暂无记录</dd></dl>
      <form id="install-form"><label for="hap">HAP 安装包</label><input id="hap" type="file" accept=".hap" data-selected><button data-selected>安装</button></form>
      <form id="launch-form"><label for="launch-bundle">Bundle</label><input id="launch-bundle" placeholder="com.example.app" required data-selected><label for="launch-ability">Ability</label><input id="launch-ability" placeholder="EntryAbility" required data-selected><button data-selected>启动应用</button></form><pre id="application-result" hidden></pre>
    </details>
    <details open><summary>文本输入</summary><form id="text-form"><label for="text">发送到当前焦点，或所选控件</label><textarea id="text" maxlength="2000" placeholder="先轻触设备中的输入框；支持粘贴和中文输入"></textarea><label class="check"><input type="checkbox" id="text-target">发送到所选控件</label><button data-device>发送文本</button></form></details>
    <details open><summary>控件检查器</summary><div class="row"><button id="tree" data-device>读取 UI 树</button><button id="clear-selection">清除选择</button></div><label class="sr-only" for="node-search">搜索控件</label><input id="node-search" type="search" placeholder="搜索文本、类型或 id"><div id="nodes" class="node-list"></div><pre id="properties">尚未选择控件</pre><div class="row"><button id="node-tap" data-device disabled>轻触控件</button><button id="node-longpress" data-device disabled>长按控件</button></div></details>
    <details id="scenarios"><summary>模拟器场景</summary>
      <form class="scene-row" data-command="rotate"><label for="rotate-direction">旋转</label><select id="rotate-direction" name="direction" data-target><option value="left">向左</option><option value="right">向右</option></select><button data-target>应用</button></form>
      <form class="scene-row" id="fold-row" data-command="fold" hidden><label for="fold-state">折叠</label><select id="fold-state" name="state" data-target><option value="open">展开</option><option value="half-open">半展开</option><option value="close">合拢</option></select><button data-target>应用</button></form>
      <form class="scene-row" data-command="battery"><label for="battery-level">电量 %</label><input id="battery-level" name="level" type="number" min="0" max="100" step="1" value="80" required data-target><button data-target>应用</button></form>
      <form class="scene-row" data-command="battery"><label for="battery-status">充电状态</label><select id="battery-status" name="status" data-target><option value="charging">充电中</option><option value="discharging">未充电</option></select><button data-target>应用</button></form>
      <form class="scene-row" data-command="geolocation"><label for="latitude">纬度</label><input id="latitude" name="latitude" type="number" min="-90" max="90" step="0.00000001" required data-target><button data-target>应用</button></form>
      <form class="scene-row" data-command="geolocation"><label for="longitude">经度</label><input id="longitude" name="longitude" type="number" min="-180" max="180" step="0.00000001" required data-target><button data-target>应用</button></form>
      <form class="scene-row" data-command="sensor"><label for="steps">步数</label><input id="steps" name="steps" type="number" min="0" max="10000" step="1" value="0" required data-target><button data-target>应用</button></form>
      <form class="scene-row" data-command="volume"><label for="volume-direction">音量</label><select id="volume-direction" name="direction" data-target><option value="up">调高</option><option value="down">调低</option></select><button data-target>应用</button></form>
      <div class="scene-row"><span>电源</span><button id="power" data-target>息屏 / 唤醒</button></div>
    </details>
    <details><summary>设备日志</summary><form id="logs-form"><label for="bundle">应用 Bundle</label><input id="bundle" placeholder="com.example.app"><label for="keyword">关键词</label><input id="keyword"><div class="row"><select id="level" aria-label="日志等级"><option value="">全部等级</option><option value="D">Debug</option><option value="I">Info</option><option value="W">Warn</option><option value="E">Error</option><option value="F">Fatal</option></select><label class="check"><input id="crash" type="checkbox">崩溃日志</label></div><button data-device>读取日志</button></form><pre id="logs"></pre></details>
    <details open><summary>操作记录</summary><ol id="events"></ol></details>
  </aside>
</main><script type="module" src="/app.js"></script>
</body></html>
